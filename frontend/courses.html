<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - Droid Alpha Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="logo">🌐 Droid Alpha Academy</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="courses.html">Courses</a></li>
    </ul>
    <div class="auth-buttons">
      <span id="userGreeting" style="color: white; margin-right: 1rem; display: none;"></span>
      <a href="dashboard.html" class="btn" id="dashboardBtn" style="display: none;">Dashboard</a>
      <a href="login.html" class="btn" id="loginBtn">Login</a>
      <button class="btn btn-danger" id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>
    </div>
  </nav>

  <header>
    <h1>Featured Courses</h1>
    <p>Learn from industry experts and advance your networking career</p>
  </header>

  <div class="container">
    <div id="coursesContainer" class="grid">
      <div class="loader"></div>
    </div>

    <div id="addCourseBtn" style="text-align: center; margin: 3rem 0; display: none;">
      <button class="btn" onclick="showAddCourseForm()">+ Add New Course</button>
    </div>

    <div id="addCourseForm" class="form-container" style="display: none;">
      <h3>Add New Course</h3>
      <form onsubmit="addCourse(event)">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="courseTitle" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="courseDesc" required></textarea>
        </div>
        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="coursePrice" required>
        </div>
        <div class="form-group">
          <label>Duration</label>
          <input type="text" id="courseDuration" placeholder="e.g., 4 weeks" required>
        </div>
        <div class="form-group">
          <label>Level</label>
          <select id="courseLevel" required>
            <option value="">Select Level</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Create Course</button>
        <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;" onclick="hideAddCourseForm()">Cancel</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 Droid Alpha Academy. All rights reserved.</p>
  </footer>

  <script>
    const API_URL = 'http://localhost:5000/api';

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      loadCourses();
    });

    function checkAuth() {
      const token = localStorage.getItem('token');
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const dashboardBtn = document.getElementById('dashboardBtn');
      const userGreeting = document.getElementById('userGreeting');
      const addCourseBtn = document.getElementById('addCourseBtn');

      if (token) {
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'block';
        dashboardBtn.style.display = 'block';
        userGreeting.textContent = '👤 Welcome!';
        userGreeting.style.display = 'block';
      } else {
        loginBtn.style.display = 'block';
        logoutBtn.style.display = 'none';
        dashboardBtn.style.display = 'none';
        userGreeting.style.display = 'none';
      }
    }

    async function loadCourses() {
      try {
        const token = localStorage.getItem('token');
        let enrolledIds = [];

        if (token) {
          const enrolledResponse = await fetch(`${API_URL}/courses/enrolled`, {
            headers: { 'Authorization': token }
          });
          if (enrolledResponse.ok) {
            const enrolledCourses = await enrolledResponse.json();
            enrolledIds = enrolledCourses.map(course => course._id);
          }
        }

        const response = await fetch(`${API_URL}/courses`);
        const courses = await response.json();

        const container = document.getElementById('coursesContainer');
        
        if (!courses || courses.length === 0) {
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: white;">No courses available yet.</p>';
          return;
        }

        container.innerHTML = courses.map(course => {
          const isEnrolled = enrolledIds.includes(course._id);
          return `
            <div class="card">
              <h3>${course.title}</h3>
              <p>${course.description}</p>
              <div class="duration">⏱️ ${course.duration}</div>
              <div class="level level-${course.level.toLowerCase()}">
                ${course.level}
              </div>
              <div class="price">₹${course.price}</div>
              <button class="btn" ${isEnrolled ? 'disabled' : ''} onclick="enrollCourse('${course._id}', ${course.price})">
                ${isEnrolled ? 'Enrolled' : 'Enroll Now'}
              </button>
            </div>
          `;
        }).join('');
      } catch (error) {
        console.error('Error loading courses:', error);
        document.getElementById('coursesContainer').innerHTML = 
          '<p style="grid-column: 1/-1; text-align: center; color: white;">Error loading courses.</p>';
      }
    }

    async function enrollCourse(courseId, price) {
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Please login to enroll in courses');
        window.location.href = 'login.html';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/courses/enroll/${courseId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': token
          }
        });

        const result = await response.json();
        if (response.ok) {
          alert(result.message || 'Enrolled successfully!');
          loadCourses();
        } else {
          alert(result.message || 'Enrollment failed. Please try again.');
        }
      } catch (error) {
        console.error('Error enrolling:', error);
        alert('Error: ' + error.message);
      }
    }

    function showAddCourseForm() {
      document.getElementById('addCourseForm').style.display = 'block';
    }

    function hideAddCourseForm() {
      document.getElementById('addCourseForm').style.display = 'none';
    }

    async function addCourse(event) {
      event.preventDefault();
      const token = localStorage.getItem('token');

      if (!token) {
        alert('Please login first');
        return;
      }

      const course = {
        title: document.getElementById('courseTitle').value,
        description: document.getElementById('courseDesc').value,
        price: parseFloat(document.getElementById('coursePrice').value),
        duration: document.getElementById('courseDuration').value,
        level: document.getElementById('courseLevel').value
      };

      try {
        const response = await fetch(`${API_URL}/courses`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': token
          },
          body: JSON.stringify(course)
        });

        if (response.ok) {
          alert('Course added successfully!');
          hideAddCourseForm();
          loadCourses();
          document.getElementById('courseTitle').value = '';
          document.getElementById('courseDesc').value = '';
          document.getElementById('coursePrice').value = '';
          document.getElementById('courseDuration').value = '';
          document.getElementById('courseLevel').value = '';
        } else {
          alert('Error adding course');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error: ' + error.message);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'courses.html';
    }
  </script>

  <style>
    select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
    }

    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
  </style>
</body>
</html>
