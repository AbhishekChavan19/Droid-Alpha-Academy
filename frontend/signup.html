<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Networking Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="logo">🌐 Networking Academy</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="courses.html">Courses</a></li>
    </ul>
    <div class="auth-buttons">
      <a href="login.html" class="btn btn-secondary">Login</a>
    </div>
  </nav>

  <div class="container">
    <div class="form-container">
      <h2>Create Your Account</h2>
      <div id="message"></div>
      
      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter a strong password">
        </div>

        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" name="confirm" required placeholder="Confirm your password">
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Sign Up</button>
      </form>

      <p style="text-align: center; margin-top: 1rem;">
        Already have an account? <a href="login.html" style="color: #667eea; text-decoration: none; font-weight: bold;">Login here</a>
      </p>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 Networking Academy. All rights reserved.</p>
  </footer>

  <script>
    const API_URL = 'http://localhost:5000/api';

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        showMessage('Passwords do not match!', 'danger');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = res.headers.get('content-type')?.includes('application/json')
          ? await res.json()
          : { message: await res.text() };

        if (res.ok) {
          showMessage('Account created successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showMessage(data.message || 'Signup failed. Please try again.', 'danger');
        }
      } catch (error) {
        showMessage('Error: ' + error.message, 'danger');
      }
    });

    function showMessage(msg, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }
  </script>
</body>
</html>
